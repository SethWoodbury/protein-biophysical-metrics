[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-property-metrics"
version = "0.2.0"
description = "Descriptive sequence and structure metrics for proteins"
requires-python = ">=3.10"
dependencies = ["biopython>=1.84", "numpy>=1.24"]

[project.optional-dependencies]
nfive = [
    "joblib>=1.4",
    # The upstream XGBRegressor pickle was serialized with XGBoost 2.1.3.
    "xgboost-cpu[scikit-learn]==2.1.3; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "xgboost[scikit-learn]==2.1.3; (sys_platform != 'linux' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'AMD64')",
]

[project.scripts]
protein-biophysical-metrics = "protein_property_metrics.cli:main"
protein-property-metrics = "protein_property_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protein_property_metrics = ["references/*.json"]
